name: Python and frontend checks
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r web_backend/requirements.txt httpx pytest
      - run: python -m unittest discover -s web_backend/tests -p 'test_*.py' -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test frontend/tests/data.test.cjs
      - run: docker build -t recruitment-crawler:test .
